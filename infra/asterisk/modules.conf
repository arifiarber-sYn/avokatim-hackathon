; Minimal module set for the AudioSocket bridge (D-059 F4): pjsip trunk,
; dialplan with CURL + UUID functions, AudioSocket app. autoload keeps the
; rest available; the noloads trim known-noisy unused channel drivers.

[modules]
autoload=yes

noload => chan_sip.so
noload => chan_skinny.so
noload => chan_mgcp.so
noload => chan_unistim.so
noload => cel_pgsql.so
noload => cdr_pgsql.so
