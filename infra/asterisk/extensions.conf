; Dialplan for the Telephony-KI (D-059 F4): every inbound call is answered
; and bridged to the backend's AudioSocket gateway (phone_gateway.py).
; Before bridging, the caller's number is linked to the call UUID over
; loopback so the gateway knows who is calling (AudioSocket only carries
; the UUID).

[from-sipgate]
exten => _X.,1,Answer()
 same => n,Set(CALL_UUID=${UUID()})
 same => n,Set(LINK=${CURL(http://127.0.0.1:8000/api/public/phone/link?uuid=${CALL_UUID}&caller=${URIENCODE(${CALLERID(num)})})})
 same => n,AudioSocket(${CALL_UUID},127.0.0.1:4573)
 same => n,Hangup()

; some providers deliver without a dialed extension — same treatment
exten => s,1,Answer()
 same => n,Set(CALL_UUID=${UUID()})
 same => n,Set(LINK=${CURL(http://127.0.0.1:8000/api/public/phone/link?uuid=${CALL_UUID}&caller=${URIENCODE(${CALLERID(num)})})})
 same => n,AudioSocket(${CALL_UUID},127.0.0.1:4573)
 same => n,Hangup()
