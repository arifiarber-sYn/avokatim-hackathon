services:
  db:
    image: pgvector/pgvector:pg17
    container_name: avokatim-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: avokatim
      POSTGRES_USER: avokatim
      POSTGRES_PASSWORD: ${DB_PASSWORD:-avokatim-dev-password}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - avokatim_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U avokatim"]
      interval: 5s
      timeout: 3s
      retries: 10

  caddy:
    image: caddy:2-alpine
    container_name: avokatim-caddy
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro,z
      - avokatim_caddy_data:/data
      - avokatim_caddy_config:/config

  # WebRTC SFU for SOS video/audio calls. Signaling on 7880 (localhost,
  # proxied by Caddy :7443 for LAN wss). Media on 7881/tcp + 7882/udp —
  # fine on LAN; public access additionally needs router port forwarding
  # or a TURN relay (see docs/agents/STATE.md).
  livekit:
    image: livekit/livekit-server:v1.9
    container_name: avokatim-livekit
    restart: unless-stopped
    command: --config /etc/livekit.yaml
    environment:
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY:-devkey}: ${LIVEKIT_API_SECRET:-devsecret-change-me-in-dot-env}"
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml:ro,z
    ports:
      - "127.0.0.1:7880:7880"
      # 7881 (TCP fallback per ICE) vetem localhost — media ne LAN kalon permes 7882/udp
      - "127.0.0.1:7881:7881"
      - "7882:7882/udp"

  redis:
    image: redis:7-alpine
    container_name: avokatim-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6380:6379"
    volumes:
      - avokatim_redis:/data
    command: ["redis-server", "--appendonly", "yes"]

  # Privacy-friendly visit analytics (no cookies, GDPR-safe). Uses its own
  # database inside the existing Postgres container. Public via the
  # Cloudflare tunnel at stats.avokatiim.ai.
  umami:
    image: ghcr.io/umami-software/umami:postgresql-latest
    container_name: avokatim-umami
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://avokatim:${DB_PASSWORD:-avokatim-dev-password}@db:5432/umami
      DATABASE_TYPE: postgresql
      APP_SECRET: ${UMAMI_APP_SECRET:-umami-dev-secret-change-me}
    ports:
      - "127.0.0.1:3210:3000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  avokatim_pgdata:
  avokatim_redis:
  avokatim_caddy_data:
  avokatim_caddy_config:
